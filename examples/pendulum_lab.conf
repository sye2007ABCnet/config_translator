' Лабораторная установка: период колебаний маятника
{ Длины нитей в сантиметрах,
  число измерений для каждой нити }
set experiment = q(Pendulum period)
set lengths = [0b1100100; 0b11001000; 0b110010000]
set measurements = 0b101
set totalRuns = $measurements * 0b11$
set baseLength = $min(0b1100100; 0b11001000; 0b110010000)$
set deltaLength = $0b11001000 - baseLength$
set precision = $sqrt(0b1100100)$
set instruments = [q(stopwatch); q(ruler); [q(sensor A); q(sensor B)]]
