' Лабораторная установка: период колебаний маятника
{ Длины нитей в сантиметрах,
  число измерений для каждой нити }
set shortest = 0b1100100
set middle = 0b11001000
set longest = 0b110010000
set measurements = 0b101

q(Pendulum period)
[$shortest$; $middle$; $longest$]
$measurements * 0b11$
$min(shortest; middle; longest)$
$middle - shortest$
$sqrt(shortest)$
[q(stopwatch); q(ruler); [q(sensor A); q(sensor B)]]
