' Параметры игрового уровня
set levelName = q(Cave of Echoes)
set mapSide = 0b100000
set mapArea = $mapSide * mapSide$
set spawnPoints = [
    [0b1; 0b1];
    [0b11110; 0b101];
    [$mapSide - 0b1$; $mapSide - 0b1$]
]
set monsters = [q(bat); q(spider); q(golem)]
set bossHealth = $min(mapSide; 0b1100100) * 0b1010$
set scanRadius = $sqrt(mapArea)$
