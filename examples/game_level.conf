' Параметры игрового уровня
set mapSide = 0b100000
set mapArea = $mapSide * mapSide$
set maxCoordinate = $mapSide - 0b1$

set f = q(Cave of Echoes)
$mapSide$
$mapArea$
[
    [0b1; 0b1];
    [0b11110; 0b101];
    [$maxCoordinate$; $maxCoordinate$]
]
[q(bat); q(spider); q(golem)]
$min(mapSide; 0b1100100) * 0b1010$
$sqrt(mapArea)$
