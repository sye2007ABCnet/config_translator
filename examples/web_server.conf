' Конфигурация веб-сервера
{
Числа записаны в двоичной системе:
0b1010000 это порт 80
}
set workers = 0b100
set connectionsPerWorker = 0b11001000
set baseTimeout = 0b1010

set f = q(example server)
set m = 0b1010000
$workers * connectionsPerWorker$
[q(localhost); q(example.org); q(www.example.org)]
[$baseTimeout$; 0b11110; $min(baseTimeout; 0b11110) * 0b10$]