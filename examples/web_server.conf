' Конфигурация веб-сервера
{
Числа записаны в двоичной системе:
0b1010000 это порт 80
}
set serverName = q(example server)
set port = 0b1010000
set workers = 0b100
set maxConnections = $workers * 0b11001000$
set allowedHosts = [q(localhost); q(example.org); q(www.example.org)]
set timeouts = [0b1010; 0b11110; $min(0b1010; 0b11110) * 0b10$]
